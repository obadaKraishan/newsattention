[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newsattention"
dynamic = ["version"]
description = "Daily news events linked to how many people read about them on Wikipedia, by country and by language"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Obada Kraishan" }]
keywords = [
    "public-attention",
    "news-events",
    "pageviews",
    "communication-research",
    "journalism",
    "dataset",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Sociology",
]
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.scripts]
newsattention = "newsattention.cli:main"

[project.urls]
Repository = "https://github.com/obadaKraishan/newsattention"
Issues = "https://github.com/obadaKraishan/newsattention/issues"
Changelog = "https://github.com/obadaKraishan/newsattention/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/newsattention/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/newsattention"]

# The sdist carries the code and the tests; never data.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures copy the portal's long wikitext lines and its en dashes in titles.
"tests/*" = ["E501", "RUF001", "RUF043"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["newsattention"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
